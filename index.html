<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>하준이의 성장 앨범</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        html { scroll-behavior: smooth; }

        :root {
            color-scheme: light;
            --bg-color: #ffffff;
            --text-color: #333333;
            --point-color: #92b4d2;
            --point-dark: #749cc0;
            --entry-bg: #f4f7fb;
            --album-bg: #fff9f0;
            --album-border: #f3dfc1;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0; padding: 0;
            color: var(--text-color);
            padding-top: 68px;
        }

        /* 상단 고정 바 */
        #dynamic-top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 55px;
            background: rgba(146, 180, 210, 0.96); backdrop-filter: blur(10px);
            border-bottom: 2px solid #7ea6ca; z-index: 3000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px;
            font-size: 1.1rem; font-weight: 900; color: #ffffff; letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        #top-bar-title { flex: 1; text-align: center; margin-left: 32px; }
        #search-toggle-btn {
            background: rgba(255,255,255,0.25); border: none; color: white;
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
        }

        /* 검색 드롭다운 바 */
        #search-bar-box {
            position: fixed; top: 55px; left: 0; width: 100%;
            background: #ffffff; border-bottom: 2px solid var(--point-color);
            padding: 10px 16px; z-index: 2999;
            display: none; align-items: center; gap: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        #search-bar-box.show { display: flex; }
        #search-input {
            flex: 1; padding: 8px 14px; border: 1.5px solid #dce4ec;
            border-radius: 20px; font-size: 0.9rem; outline: none;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #search-input:focus { border-color: var(--point-color); }
        #search-clear-btn {
            background: #eef2f6; border: none; border-radius: 15px;
            padding: 6px 12px; font-size: 0.8rem; font-weight: 700; color: #555; cursor: pointer;
        }
        #search-status {
            text-align: center; font-size: 0.85rem; color: var(--point-dark);
            font-weight: 700; margin: 10px 0; display: none;
        }

        /* 우측 하단 TIME SLICE 내비게이션 */
        #smart-nav { position: fixed; bottom: 25px; right: 15px; z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        a { text-decoration: none; -webkit-tap-highlight-color: transparent; }
        #btn-top { width: 36px; height: 36px; border-radius: 50%; background: #f1f2f6; color: #7f8c8d; border: 1px solid #dfe4ea; font-size: 10px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        #nav-toggle { width: 58px; height: 58px; border-radius: 50%; background: var(--point-color); color: white; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(146, 180, 210, 0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #nav-toggle .icon { font-size: 22px; line-height: 1; }
        #nav-toggle .label { font-size: 9px; font-weight: 700; margin-top: 2px; letter-spacing: -0.5px; }

        #nav-container {
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px);
            padding: 15px 8px; border-radius: 20px; border: 2.5px solid var(--point-color);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2); width: 64px; max-height: 60vh;
            overflow-y: auto; text-align: center; margin-bottom: 5px;
            opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.25s ease;
        }
        #nav-container.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #nav-container::-webkit-scrollbar { width: 0; }

        .nav-year { font-family: 'Montserrat', sans-serif; font-weight: 900; color: #2c3e50; font-size: 0.75rem; margin: 10px 0 6px; border-bottom: 2px solid var(--point-color); padding-bottom: 3px; }
        .nav-month-grid { display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .nav-month { width: 44px; height: 30px; line-height: 28px; font-size: 0.78rem; font-weight: 700; color: #333; cursor: pointer; text-align: center; border-radius: 10px; background: #fff; border: 1.5px solid #eee; display: block; margin: 0 auto; }
        .nav-month:hover { background: var(--entry-bg); border-color: var(--point-color); }

        .credit-header { width: 100%; max-width: 800px; margin: 18px auto 10px; text-align: center; padding: 0 20px; }
        .credit-title { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: #ced6e0; letter-spacing: 4px; margin-bottom: 12px; font-weight: 700; }
        .credit-badge { display: inline-block; background: #fff; padding: 10px 22px; border-radius: 40px; border: 1px solid #f1f2f6; font-size: 0.82rem; color: #7f8c8d; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }

        .book-container { width: 100%; max-width: 850px; margin: 0 auto 60px auto; padding: 0 12px; }

        .month-header { background: #fdfdfd; color: var(--point-color); padding: 8px 25px; border-radius: 20px; border: 2px solid var(--point-color); font-size: 1.1rem; font-weight: 900; margin: 30px auto 20px auto; display: inline-block; scroll-margin-top: 80px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .month-header-wrapper { text-align: center; width: 100%; }

        .entry { display: flex; flex-direction: row; gap: 15px; margin-bottom: 42px; align-items: flex-start; }
        .entry-left { flex: 0 0 65px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: sticky; top: 70px; z-index: 10; pointer-events: none; }
        .date-num { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; color: #2f3640; line-height: 1; }
        .date-day { font-size: 0.8rem; color: #7f8c8d; font-weight: 700; white-space: nowrap; }
        .weather-icon { font-size: 1.4rem; margin-top: 4px; }

        .entry-right { flex: 1; min-width: 0; }
        .entry-header { margin-bottom: 10px; }

        /* 앨범 제목/코멘트 박스 */
        .album-note {
            background: var(--album-bg); border: 1px solid var(--album-border);
            padding: 12px 15px; border-radius: 12px; margin-bottom: 12px;
            font-size: 0.9rem; color: #5c4b32;
        }
        .album-note-title { font-weight: 800; margin-bottom: 4px; color: #d38b28; }

        /* 동영상 그리드 */
        .video-gallery { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 14px 0; }
        .video-gallery video { width: 100%; max-height: 450px; border-radius: 10px; background: #000; }

        /* 사진 그리드 */
        .photo-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 15px 0; }
        .photo-gallery img {
            width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px;
            cursor: pointer; position: relative; z-index: 20; pointer-events: auto;
            background: #f0f3f7; transition: transform 0.15s ease;
        }
        .photo-gallery img:hover { transform: scale(1.02); }

        .entry-content { background: var(--entry-bg); padding: 18px; border-radius: 15px; font-size: 0.95rem; line-height: 1.75; white-space: pre-wrap; word-break: keep-all; color: #444; }

        /* 고도화된 라이트박스 (좌우 넘기기 + 저장) */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 4000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            user-select: none;
        }
        #lightbox.active { display: flex; }
        #lightbox-top {
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; color: #fff; z-index: 4010;
        }
        #lightbox-counter { font-family: 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 700; }
        .lb-actions { display: flex; gap: 12px; }
        .lb-btn {
            background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            font-weight: 700; cursor: pointer; text-decoration: none;
        }
        #lightbox-img { max-width: 92%; max-height: 82%; object-fit: contain; pointer-events: auto; border-radius: 4px; }
        .lb-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.15); color: white; border: none;
            width: 44px; height: 44px; border-radius: 50%; font-size: 22px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 4010;
        }
        #lb-prev { left: 12px; }
        #lb-next { right: 12px; }

        @media (min-width: 768px) {
            .book-container { padding: 0 20px; }
            .entry { gap: 40px; margin-bottom: 60px; }
            .entry-left { flex: 0 0 90px; top: 80px; }
            .date-num { font-size: 3.5rem; }
            #smart-nav { bottom: 40px; right: 30px; }
            #lb-prev { left: 30px; }
            #lb-next { right: 30px; }
        }
    </style>
</head>
<body>

<div id="dynamic-top-bar">
    <div id="top-bar-title">📅 HAJUN'S MEMORY BOOK</div>
    <button id="search-toggle-btn" onclick="toggleSearch()" title="기록 검색">🔍</button>
</div>

<div id="search-bar-box">
    <input type="text" id="search-input" placeholder="키워드 검색 (예: 생일, 운동회, 산책, 감기...)" oninput="filterEntries()">
    <button id="search-clear-btn" onclick="clearSearch()">초기화</button>
</div>

<div id="top-anchor"></div>

<div id="smart-nav">
    <div id="nav-container"><div id="nav-items"></div></div>
    <a id="btn-top" href="#top-anchor" onclick="closeNavDelayed()">TOP</a>
    <button id="nav-toggle" onclick="toggleNav()"><span class="icon">📅</span><span class="label">TIME SLICE</span></button>
</div>

<div class="credit-header">
    <div class="credit-title">HAJUN'S MEMORY BOOK</div>
    <div class="credit-badge">Created by <b>두인호</b> x <b>Gemini</b> | <span id="info-tag" style="color:#e74c3c; font-weight:900;"></span></div>
</div>

<div id="search-status"></div>
<div id="album-content" class="book-container"></div>

<!-- 고도화된 라이트박스 -->
<div id="lightbox" onclick="closeLightboxOnBg(event)">
    <div id="lightbox-top">
        <span id="lightbox-counter">1 / 1</span>
        <div class="lb-actions">
            <a id="lightbox-download" class="lb-btn" href="" download>⬇ 저장</a>
            <button class="lb-btn" onclick="closeLightbox()">✕ 닫기</button>
        </div>
    </div>
    <button id="lb-prev" class="lb-nav" onclick="changeSlide(-1)">‹</button>
    <img id="lightbox-img" src="">
    <button id="lb-next" class="lb-nav" onclick="changeSlide(1)">›</button>
</div>

<script src="./reports.js"></script>
<script src="./albums.js"></script>

<script>
    const lastMod = new Date(document.lastModified);
    const dateStr = `${lastMod.getFullYear()}.${String(lastMod.getMonth() + 1).padStart(2, '0')}.${String(lastMod.getDate()).padStart(2, '0')}`;
    document.getElementById('info-tag').innerText = `v26 (Media & Search) | ${dateStr}`;

    function toggleNav() {
        document.getElementById('nav-container').classList.toggle('show');
    }

    function closeNavDelayed() {
        setTimeout(() => {
            document.getElementById('nav-container').classList.remove('show');
        }, 250);
    }

    function toggleSearch() {
        const box = document.getElementById('search-bar-box');
        box.classList.toggle('show');
        if (box.classList.contains('show')) {
            document.getElementById('search-input').focus();
        }
    }

    function clearSearch() {
        document.getElementById('search-input').value = '';
        filterEntries();
    }

    function filterEntries() {
        const q = document.getElementById('search-input').value.trim().toLowerCase();
        const entries = document.querySelectorAll('.entry');
        const monthWrappers = document.querySelectorAll('.month-header-wrapper');
        const statusEl = document.getElementById('search-status');

        let visibleCount = 0;
        entries.forEach(entry => {
            const text = entry.getAttribute('data-search') || '';
            if (!q || text.includes(q)) {
                entry.style.display = 'flex';
                visibleCount++;
            } else {
                entry.style.display = 'none';
            }
        });

        monthWrappers.forEach(wrap => {
            wrap.style.display = q ? 'none' : 'block';
        });

        if (q) {
            statusEl.style.display = 'block';
            statusEl.textContent = `🔍 "${q}" 검색 결과: ${visibleCount}건`;
        } else {
            statusEl.style.display = 'none';
        }
    }

    // 전체 날씨 아이콘 매핑
    const weatherMap = {
        'sunny': '☀️',
        'mostly_cloudy': '⛅',
        'partly_cloudy': '🌤️',
        'overcast': '☁️',
        'rain': '🌧️',
        'snow': '❄️',
        'fog': '🌫️',
        'yellow_sand': '😷',
        'mixed_rain_snow': '🌨️',
        'thunderstorm': '⛈️',
        'sunny_after_rain': '🌦️'
    };
    const weekDays = ['일', '월', '화', '수', '목', '금', '토'];

    // 라이트박스 상태 관리
    let currentGallery = [];
    let currentSlideIdx = 0;

    function openLightbox(gallery, idx) {
        currentGallery = gallery;
        currentSlideIdx = idx;
        updateLightboxUI();
        document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
    }

    function closeLightboxOnBg(e) {
        if (e.target.id === 'lightbox') closeLightbox();
    }

    function changeSlide(step) {
        if (!currentGallery.length) return;
        currentSlideIdx = (currentSlideIdx + step + currentGallery.length) % currentGallery.length;
        updateLightboxUI();
    }

    function updateLightboxUI() {
        const src = currentGallery[currentSlideIdx];
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox-download').href = src;
        document.getElementById('lightbox-counter').textContent = `${currentSlideIdx + 1} / ${currentGallery.length}`;
        document.getElementById('lb-prev').style.display = currentGallery.length > 1 ? 'flex' : 'none';
        document.getElementById('lb-next').style.display = currentGallery.length > 1 ? 'flex' : 'none';
    }

    // 키보드 화살표 / ESC 지원
    document.addEventListener('keydown', (e) => {
        if (!document.getElementById('lightbox').classList.contains('active')) return;
        if (e.key === 'ArrowLeft') changeSlide(-1);
        if (e.key === 'ArrowRight') changeSlide(1);
        if (e.key === 'Escape') closeLightbox();
    });

    // 모바일 터치 스와이프 지원
    let touchStartX = 0;
    document.getElementById('lightbox').addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    document.getElementById('lightbox').addEventListener('touchend', e => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 45) {
            changeSlide(diff > 0 ? -1 : 1);
        }
    }, { passive: true });

    function render() {
        const container = document.getElementById('album-content');
        const nav = document.getElementById('nav-items');
        if (typeof reportsData === 'undefined') return;

        const data = {};
        reportsData.forEach(r => {
            const d = new Date(r.date_written);
            const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            if(!data[s]) data[s] = { date: d, reports: [], albums: [], weather: r.weather };
            data[s].reports.push(r);
        });

        if (typeof albumsData !== 'undefined') {
            albumsData.forEach(a => {
                const d = new Date(a.date_written);
                const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                if(!data[s]) data[s] = { date: d, reports: [], albums: [], weather: 'sunny' };
                data[s].albums.push(a);
            });
        }

        const sorted = Object.keys(data).sort((a,b) => new Date(a) - new Date(b));
        let lastYear = '', lastYM = '';

        sorted.forEach(dateStr => {
            const day = data[dateStr];
            const year = day.date.getFullYear();
            const month = day.date.getMonth()+1;
            const YM = `${year}년 ${month}월`;
            const mId = `m-${year}-${month}`;

            if(lastYM !== YM) {
                lastYM = YM;
                if(lastYear !== year) {
                    lastYear = year;
                    const yrDiv = document.createElement('div');
                    yrDiv.className = 'nav-year';
                    yrDiv.textContent = year;
                    nav.appendChild(yrDiv);
                }

                const hWrap = document.createElement('div');
                hWrap.className = 'month-header-wrapper';
                const h = document.createElement('div');
                h.className = 'month-header';
                h.id = mId;
                h.textContent = YM;
                hWrap.appendChild(h);
                container.appendChild(hWrap);

                const a = document.createElement('a');
                a.className = 'nav-month';
                a.href = `#${mId}`;
                a.textContent = month + "월";
                a.onclick = () => closeNavDelayed();
                nav.appendChild(a);
            }

            const div = document.createElement('div');
            div.className = 'entry';
            div.setAttribute('data-ym', YM);

            let authorName = (day.reports.length > 0 && day.reports[0].author_name) ? day.reports[0].author_name : "선생님";
            let className = (day.reports.length > 0 && day.reports[0].class_name) ? ` (${day.reports[0].class_name})` : "";

            const rightDiv = document.createElement('div');
            rightDiv.className = 'entry-right';

            // 헤더
            const headerDiv = document.createElement('div');
            headerDiv.className = 'entry-header';
            headerDiv.innerHTML = `<div style="font-size:1rem;color:#2c3e50;font-weight:700;">원에서 가정으로</div><div style="font-size:0.78rem;color:#95a5a6;">${authorName}${className}</div>`;
            rightDiv.appendChild(headerDiv);

            // 앨범 제목 및 설명 표시
            let albumSearchText = '';
            day.albums.forEach(a => {
                const isDefaultTitle = /^\d{1,2}[.\/]\d{1,2}$/.test((a.title || '').trim());
                if ((a.title && !isDefaultTitle) || (a.content && a.content.trim() !== '')) {
                    const noteDiv = document.createElement('div');
                    noteDiv.className = 'album-note';
                    let inner = '';
                    if (a.title && !isDefaultTitle) inner += `<div class="album-note-title">📸 ${a.title}</div>`;
                    if (a.content && a.content.trim() !== '') inner += `<div>${a.content}</div>`;
                    noteDiv.innerHTML = inner;
                    rightDiv.appendChild(noteDiv);
                    albumSearchText += ` ${a.title || ''} ${a.content || ''}`;
                }
            });

            // 동영상 갤러리
            let allVideos = [];
            day.albums.forEach(a => {
                if (a.local_videos && a.local_videos.length > 0) {
                    allVideos = allVideos.concat(a.local_videos.map(v => `./album_videos/${v.split(/[\\\/]/).pop()}`));
                }
            });
            if (allVideos.length > 0) {
                const vidGal = document.createElement('div');
                vidGal.className = 'video-gallery';
                allVideos.forEach(vSrc => {
                    const video = document.createElement('video');
                    video.src = vSrc;
                    video.controls = true;
                    video.playsInline = true;
                    video.preload = 'metadata';
                    video.onerror = () => video.remove();
                    vidGal.appendChild(video);
                });
                rightDiv.appendChild(vidGal);
            }

            // 사진 갤러리
            let allImages = [];
            day.reports.forEach(r => {
                if(r.local_images) allImages = allImages.concat(r.local_images.map(img => `./images/${img.split(/[\\\/]/).pop()}`));
            });
            day.albums.forEach(a => {
                if(a.local_images) {
                    const filtered = a.local_images.filter(img => {
                        if (img.includes('145416371')) {
                            return img.includes('img_76.jpg') || img.includes('img_77.jpg');
                        }
                        return true;
                    });
                    allImages = allImages.concat(filtered.map(img => `./album_images/${img.split(/[\\\/]/).pop()}`));
                }
            });

            if(allImages.length > 0) {
                const photoGal = document.createElement('div');
                photoGal.className = 'photo-gallery';
                allImages.forEach((src, idx) => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.loading = 'lazy';
                    img.onclick = () => openLightbox(allImages, idx);
                    img.onerror = () => img.remove();
                    photoGal.appendChild(img);
                });
                rightDiv.appendChild(photoGal);
            }

            // 알림장 본문
            let allContent = day.reports.map(r => r.content).filter(Boolean).join('\n\n');
            if(allContent.trim() !== '') {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'entry-content';
                contentDiv.textContent = allContent;
                rightDiv.appendChild(contentDiv);
            }

            // 검색용 텍스트 속성 저장
            div.setAttribute('data-search', `${YM} ${dateStr} ${authorName} ${albumSearchText} ${allContent}`.toLowerCase());

            div.innerHTML = `
                <div class="entry-left">
                    <div class="date-num">${day.date.getDate()}</div>
                    <div class="date-day">${weekDays[day.date.getDay()]}요일</div>
                    <div class="weather-icon">${weatherMap[day.weather] || '☀️'}</div>
                </div>
            `;
            div.appendChild(rightDiv);
            container.appendChild(div);
        });

        window.addEventListener('scroll', () => {
            let currentMonthText = "HAJUN'S MEMORY BOOK";
            const headers = document.querySelectorAll('.month-header');
            headers.forEach(header => {
                const rect = header.getBoundingClientRect();
                if (rect.top <= 90) {
                    currentMonthText = header.textContent;
                }
            });
            document.getElementById('top-bar-title').textContent = `📅 ${currentMonthText}`;
        });
    }

    window.onload = render;
</script>
</body>
</html>
